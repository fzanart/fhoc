[project]
name = "fhoc"
version = "0.1.0"
description = "An AI-based tool to detect and counter climate misinformation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "google-genai>=1.56.0",
    "gradio>=6.2.0",
    "langchain>=1.2.0",
    "langchain-google-genai>=4.1.2",
    "langchain-text-splitters>=1.1.0",
    "pip>=25.3",
    "python-dotenv>=1.2.1",
    "torch>=2.10.0",
    "transformers>=5.2.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"
